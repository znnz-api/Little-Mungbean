<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            <!-- padding: 20px; -->
        }

        .gallery {
            display: grid;
            /* 定义 3 列，每列等宽 */
            grid-template-columns: repeat(2, 1fr);
            /* 定义 2 行，每行高度自适应 */
            grid-template-rows: repeat(3, auto);
            gap: 20px; /* 图片之间的间距 */
            <!-- max-width: 1000px; -->
            width: 100%;
            background: #161616;
            padding: 31px;
			padding: 0px;
            <!-- border-radius: 12px; -->
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .gallery-item {
            overflow: hidden;
            <!-- border-radius: 8px; -->
            background-color: #000;
<!--             aspect-ratio: 4 / 3; /* 保持图片容器比例，可自由更改如 16/9 或 1/1 */ -->
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 保证图片填满容器且不变形 */
            display: block;
            transition: transform 0.3s ease;
        }

        /* 鼠标悬停放大效果 */
        .gallery-item img:hover {
            <!-- transform: scale(1.05); -->
        }
    </style>
</head>
<body>

    <div class="gallery">
        <!-- 如果 HTML 文件就在 D:\桌面\111\ 目录下，可直接使用相对路径 -->
        <div class="gallery-item"><img src="1.png" alt="图片 1"></div>
        <div class="gallery-item"><img src="2.png" alt="图片 2"></div>
        <div class="gallery-item"><img src="3.png" alt="图片 3"></div>
        <div class="gallery-item"><img src="4.png" alt="图片 4"></div>
        <div class="gallery-item"><img src="5.png" alt="图片 5"></div>
        <div class="gallery-item"><img src="6.png" alt="图片 6"></div>
		<div class="gallery-item"><img src="7.png" alt="图片 7"></div>
        <div class="gallery-item"><img src="8.png" alt="图片 8"></div>
    </div>

</body>
</html>
