<svg t="1785479562748" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="180" height="180">
  <defs>
    <!-- 轮廓路径（原样），供多层复用 -->
    <path id="body" d="M407.05566594 35.8312821c194.86425695-71.52712311 346.86764626 49.71026963 425.79564467 220.9349632 97.92923117 211.10294503 111.90377182 537.75508163-110.35679858 680.09215367a502.07372325 502.07372325 0 0 1-443.19423905 37.33836738 290.52934068 290.52934068 0 0 1-113.7808523-73.34983302c-74.56540445-80.80637345-36.06713078-178.12846617 9.33491548-260.48181285l19.55270606-33.58161731c30.15756357-51.25724286 61.25366739-103.50739659 60.31512715-165.70089876 0-22.03821954-5.9095672-46.56195255-11.82042896-71.14135072-4.03248672-16.79145591-8.0636789-34.19005029-10.27345573-50.37307323-18.61416581-140.18296035 49.71026963-238.05652638 174.42738126-283.73560383z"/>
    <path id="eyeR" d="M633.23739275 358.11953019c28.28048308 0 51.58864466-23.30816158 51.58864467-52.19578311a51.92004645 51.92004645 0 0 0-51.58864467-52.25144825 52.08574736 52.08574736 0 0 0-51.92004646 52.25144825c0 28.88762153 23.30945612 52.19578311 51.92004646 52.19578311z"/>
    <path id="eyeL" d="M425.00702815 434.56330967h-0.3314018a52.25144827 52.25144827 0 0 0 0-104.39156622 51.92004645 51.92004645 0 0 0-51.58864466 52.19578311c0 28.61059035 22.97805431 52.19578311 51.92004646 52.19578311z"/>
    <clipPath id="clipBody"><use href="#body" xlink:href="#body"/></clipPath>

    <!-- 身体主渐变：上亮下深 -->
    <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6FF4D"/>
      <stop offset=".45" stop-color="#9BFF00"/>
      <stop offset="1" stop-color="#58C400"/>
    </linearGradient>
    <!-- 左上方受光 -->
    <radialGradient id="gLight" cx=".3" cy=".18" r=".75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 底部反光 -->
    <radialGradient id="gBounce" cx=".5" cy="1" r=".6">
      <stop offset="0" stop-color="#F4FF8A" stop-opacity=".4"/>
      <stop offset="1" stop-color="#F4FF8A" stop-opacity="0"/>
    </radialGradient>
    <!-- 上方玻璃高光 -->
    <linearGradient id="gGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".00"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 边缘：上白下深 -->
    <linearGradient id="gRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".15"/>
      <stop offset=".35" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".7" stop-color="#2A7A00" stop-opacity="0"/>
      <stop offset="1" stop-color="#2A7A00" stop-opacity=".55"/>
    </linearGradient>
    <!-- 眼睛：深色球面 -->
    <radialGradient id="gEye" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#4A4A4A"/>
      <stop offset=".6" stop-color="#1B1B1B"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <!-- 眼睛下缘的反光边 -->
    <linearGradient id="gEyeRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".4"/>
    </linearGradient>
    <!-- 投影 -->
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#2F6B00" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- 1 投影 + 身体底色 -->
  <use href="#body" xlink:href="#body" fill="url(#gBody)" filter="url(#shadow)"/>

  <g clip-path="url(#clipBody)">
    <!-- 2 左上受光 -->
    <rect width="1024" height="1024" fill="url(#gLight)"/>
    <!-- 3 底部反光 -->
    <rect width="1024" height="1024" fill="url(#gBounce)"/>
    <!-- 4 顶部玻璃高光 -->
    <ellipse cx="470" cy="165" rx="285" ry="150" fill="url(#gGloss)"/>
    <!-- 5 内描边：上沿亮边、下沿暗边 -->
    <use href="#body" xlink:href="#body" fill="none" stroke="url(#gRim)" stroke-width="26"/>
  </g>

  <!-- 6 右眼 -->
  <use href="#eyeR" xlink:href="#eyeR" fill="url(#gEye)"/>
  <use href="#eyeR" xlink:href="#eyeR" fill="none" stroke="url(#gEyeRim)" stroke-width="5"/>
  <ellipse cx="620" cy="290" rx="17" ry="12" fill="#FFFFFF" opacity=".85"/>
  <circle cx="654" cy="328" r="6" fill="#FFFFFF" opacity=".35"/>

  <!-- 7 左眼 -->
  <use href="#eyeL" xlink:href="#eyeL" fill="url(#gEye)"/>
  <use href="#eyeL" xlink:href="#eyeL" fill="none" stroke="url(#gEyeRim)" stroke-width="5"/>
  <ellipse cx="412" cy="366" rx="17" ry="12" fill="#FFFFFF" opacity=".85"/>
  <circle cx="446" cy="404" r="6" fill="#FFFFFF" opacity=".35"/>
</svg>